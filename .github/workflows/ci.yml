name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # SECURITY.md R5 — la service role key jamás puede llegar al bundle del frontend
      - name: Check service_role not in frontend build
        run: |
          if grep -ri "service_role" frontend/dist; then
            echo "::error::SUPABASE_SERVICE_ROLE_KEY o referencia a service_role detectada en el build del frontend"
            exit 1
          fi
          echo "OK: frontend build limpio"

      - name: Audit dependencies
        run: npm audit --audit-level=high

  gitleaks:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
